# Midnight: near-black surfaces under a crisp hairline.
#
# Colors are "#rrggbb", "#rrggbbaa", or a palette color adjusted:
#   "background * 0.6"     lightness times 0.6 (darker)
#   "background + 0.05"    lightness plus 0.05 (lighter)
#   "foreground / 0.14"    at 14% opacity
# Palette colors: background, foreground, accent, success, warning, danger,
# black, white. Anything left out comes from Midnight.

backdrop = "black / 0.22"          # behind the palette, Agents and dialogs
divider  = "foreground / 0.08"     # lines between sections

[surface]   # menus, the palette, Agents, dialogs, prompts, toasts, which-key
background = "background"
border     = "foreground / 0.14"
highlight  = "white / 0.08"        # the lit top edge
radius     = 10
shadow     = 0.55                  # 0 = flat, 1 = deep

[field]     # text boxes on a surface
background = "black / 0.35"
border     = "foreground / 0.10"

[row]
hover    = "foreground / 0.05"
selected = "foreground / 0.08"

# [chrome]  # the window itself; each one is optional
# topbar     = "background * 0.4"
# sidebar    = "background * 0.72"
# tab_active = "background + 0.04"
# border     = "foreground / 0.08"
# accent     = "#3b82f6"
